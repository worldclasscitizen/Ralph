name: Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit that passed CI
        required: true
      ci_run_id:
        description: Successful main CI run containing the tested tarball
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ralph-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      archive: ${{ steps.metadata.outputs.archive }}
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the release version from the verified checkout
        id: metadata
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            printf 'version=%s\n' "$version"
            printf 'tag=v%s\n' "$version"
            printf 'archive=.release/package/worldclasscitizen-ralph-%s.tgz\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Verify main and trusted CI identity
        run: |
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > /tmp/ci-run.json
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/ci-run.json"));if(r.head_sha!==process.env.RELEASE_SHA||r.head_branch!=="main"||r.conclusion!=="success"||r.path!==".github/workflows/ci.yml")throw Error("CI identity mismatch")'
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: .release/package
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: evidence-*
          merge-multiple: true
          path: .release/evidence
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - run: cp docs/project/evidence/live-*.json .release/evidence/
      - run: npm run release -- manifest --archive "$RELEASE_ARCHIVE"
        env:
          RELEASE_ARCHIVE: ${{ steps.metadata.outputs.archive }}
      - run: npm run release -- verify --archive "$RELEASE_ARCHIVE"
        env:
          RELEASE_ARCHIVE: ${{ steps.metadata.outputs.archive }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_ARCHIVE: ${{ needs.verify.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release
          path: .release
      - run: npm run release -- verify --archive "$RELEASE_ARCHIVE"
      - name: Prepare release tag and draft
        id: draft
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Ralph $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --verify-tag --title "Ralph $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          echo "is_draft=$draft" >> "$GITHUB_OUTPUT"
          if [ "$draft" = true ]; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" .release/evidence/*.json assets/catalog.json assets/catalog.sig assets/catalog-v2.json assets/catalog-v2.sig --clobber
            sha256sum .release/package/*.tgz .release/evidence/*.json assets/catalog*.json assets/catalog*.sig > .release/SHA256SUMS.txt
            gh release upload "$RELEASE_TAG" .release/SHA256SUMS.txt --clobber
          fi
      - run: npm run release -- publish --archive "$RELEASE_ARCHIVE"
      - run: npm run smoke -- --package "@worldclasscitizen/ralph@$RELEASE_VERSION" --expected-version "$RELEASE_VERSION"
      - run: npm run smoke -- --package @worldclasscitizen/ralph --expected-version "$RELEASE_VERSION"
      - run: node scripts/verify-published.mjs --registry-only
      - if: steps.draft.outputs.is_draft == 'true'
        run: |
          gh release upload "$RELEASE_TAG" .release/evidence/installation.json --clobber
          sha256sum .release/package/*.tgz .release/evidence/*.json assets/catalog*.json assets/catalog*.sig > .release/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" .release/SHA256SUMS.txt --clobber
      - if: steps.draft.outputs.is_draft != 'true'
        name: Preserve immutable installation evidence during a registry recheck
        run: |
          mv .release/evidence/installation.json .release/evidence/installation-recheck.json
          gh release download "$RELEASE_TAG" --pattern installation.json --dir .release/evidence --clobber
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir .release --clobber
      - name: Publish GitHub release after registry verification
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          node scripts/verify-published.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-release-evidence
          path: .release/evidence/
